# .github/workflows/claude.yml — the cloud agent: responds to @claude in issues, PRs and comments.
# Based on anthropics/claude-code-action examples/claude.yml (v1); added: a pinned runner image,
# actions/checkout@v7 as in ci.yml, subscription auth, uv and a PostgreSQL service so the agent
# runs the repository gates, a plan-first instruction, a timeout and one run per issue at a time.
# Only people with write access can start the agent: the action checks the actor's permission
# and rejects bots (allowed_bots, allowed_non_write_users and github_token are deliberately unset).
# No subprocess isolation, deliberately: CLAUDE_CODE_SUBPROCESS_ENV_SCRUB is unset, so the agent's
# Bash commands inherit Claude Code's credentials, the OAuth token included. Setting it to "1"
# needs bubblewrap on the runner, and with it the Claude Code sandbox rejects the agent's file
# writes (checked on 25.10.2026). The protection meanwhile: only people with write access start
# the agent (above). Bring isolation back once the sandbox allows writes to the working directory:
# install bubblewrap in a step and set CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1" in the job env.
name: Claude Code
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    if: |
      github.event.sender.type != 'Bot' && (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    concurrency:
      group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
      cancel-in-progress: false
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write # OIDC exchange for the Claude GitHub App token
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_DB: app
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Агент Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: |
            {"env": {"TEST_DATABASE_URL": "postgresql://app@localhost:5432/app"}}
          claude_args: |
            --allowedTools "Bash(uv sync:*),Bash(uv run pytest:*),Bash(uv run ruff check:*),Bash(uv run mypy:*)"
            --append-system-prompt "Правила репозиторію — CLAUDE.md; дотримуйся їх. Виклик @claude людиною з правом запису — погоджена задача: план не чекає окремого погодження, якщо Issue прямо не просить чекати.
            1. Перш ніж змінювати файли, онови свій коментар планом: короткі нумеровані кроки-чекбокси — що робиться і в яких файлах; тести — окремим кроком перед кодом; останній крок — прогін гейтів. Далі виконуй план і познач кроки в міру виконання.
            2. Гейти: uv run pytest, uv run ruff check ., uv run mypy src. Роботу завершуй лише на зелених.
            3. Розбіжність між задачею, CLAUDE.md і реальністю — зупинись і опиши її в коментарі; постановку сам не виправляй.
            4. Наприкінці — підсумок у тому самому коментарі (замість файла в .handoff/): що змінено, коміти, результат гейтів, розбіжності, відкриті запитання.
            Пиши коментарі українською."
